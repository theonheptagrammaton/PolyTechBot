version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: polytech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: polytech
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: polytech_db
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polytech"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: polytech-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polytech-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://polytech:${POSTGRES_PASSWORD}@postgres:5432/polytech_db?connection_limit=40&pool_timeout=20&connect_timeout=10
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WEBHOOK_PORT: 8443
      COPY_TRADE_WORKER: external
    ports:
      - "8443:8443"
    volumes:
      - ./logs:/app/logs

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: polytech-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://polytech:${POSTGRES_PASSWORD}@postgres:5432/polytech_db?connection_limit=40&pool_timeout=20&connect_timeout=10
      REDIS_HOST: redis
      REDIS_PORT: 6379
      HEALTH_PORT: 3001
    volumes:
      - ./logs:/app/logs

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: polytech-dashboard
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://polytech:${POSTGRES_PASSWORD}@postgres:5432/polytech_db?connect_timeout=10
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN}
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:
  redis_data:
